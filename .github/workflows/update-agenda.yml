name: Update Jeffrey Parmentier agenda

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jp-fans-agenda-update
  cancel-in-progress: false

jobs:
  update-agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Refresh agenda from official source
        run: python scripts/update_agenda.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "Agenda is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automatically update Jeffrey Parmentier agenda"
          git push
